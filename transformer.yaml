# Transformer configuration for NLP Experiment II
# Default values correspond to the Section 3.3-3.5 baseline.
# Section 3.6/3.7 experiment scripts override selected values from the command line.

# -----------------------------------------------------------------------------
# Runtime / checkpoint
# -----------------------------------------------------------------------------

# The frequency to save trained models when training.
save_step: 5000

# The frequency to fetch and print output when training.
print_step: 100

# Path of a checkpoint used to resume training.
init_from_checkpoint: ""

# Path of a pretrained model used to initialize training.
init_from_pretrain_model: ""

# Path of trained parameters used for prediction.
init_from_params: "saved_models/step_final"

# Directory for saving models.
save_model_path: "saved_models"

# Random seed. Keep None unless a fixed seed is required.
random_seed: None


# -----------------------------------------------------------------------------
# Dataset / vocabulary
# -----------------------------------------------------------------------------

# WMT18 English -> Chinese training data.
training_file: "wmt18_zhen_data_bpe3/train.tok.clean.bpe.32000.en-zh"

# Default prediction set. Change to newstest2017 when evaluating 2017.
predict_file: "wmt18_zhen_data_bpe3/newstest2018.tok.bpe.32000.en-zh"

# Translation output file.
output_file: "output_file/predict_2018.txt"

# Shared BPE vocabulary.
src_vocab_fpath: "wmt18_zhen_data_bpe3/vocab_all.bpe.32000"
trg_vocab_fpath: "wmt18_zhen_data_bpe3/vocab_all.bpe.32000"

# <bos>, <eos>, <unk>
special_token: ["<s>", "<e>", "<unk>"]


# -----------------------------------------------------------------------------
# Device / data reader
# -----------------------------------------------------------------------------

use_cuda: True

token_delimiter: " "
use_token_batch: True
pool_size: 200000
sort_type: "pool"
shuffle: True
shuffle_batch: True
batch_size: 4096


# -----------------------------------------------------------------------------
# Section 3.3 baseline training hyperparameters
# -----------------------------------------------------------------------------

# Number of epochs required by the course baseline experiment.
epoch: 10

# Adam optimizer.
# The static learning_rate is multiplied by the Transformer LR scheduler.
learning_rate: 2.0
beta1: 0.9
beta2: 0.997
eps: 1e-9

# Learning-rate warmup.
warmup_steps: 8000

# Label smoothing.
label_smooth_eps: 0.1


# -----------------------------------------------------------------------------
# Generation
# -----------------------------------------------------------------------------

beam_size: 5
max_out_len: 255
n_best: 1


# -----------------------------------------------------------------------------
# Transformer model
# -----------------------------------------------------------------------------

# These vocabulary-related values are updated automatically from the vocabulary
# files and special tokens.
src_vocab_size: 32000
trg_vocab_size: 32000
bos_idx: 0
eos_idx: 1
unk_idx: 2

# Maximum sequence length / positional encoding table size.
max_length: 256

# Model dimensions.
d_model: 512
d_inner_hid: 2048
d_key: 64
d_value: 64
n_head: 8
n_layer: 6

# Dropout.
prepostprocess_dropout: 0.1
attention_dropout: 0.1
relu_dropout: 0.1

# Current implementation uses Pre-LN.
preprocess_cmd: "n"
postprocess_cmd: "da"

# Source/target vocabulary is shared in this experiment.
weight_sharing: True


# -----------------------------------------------------------------------------
# Section 3.7 model variants
#
# IMPORTANT:
#   The defaults below reproduce the ordinary Transformer baseline.
#   run_model_improvements.py changes these values from the command line.
# -----------------------------------------------------------------------------

# Attention implementation:
#   normal        -> baseline Transformer
#   drophead      -> Scheduled DropHead
#   relative_bias -> learned relative-position bias
attention_variant: "normal"

# Feed-forward implementation:
#   relu   -> baseline Transformer FFN
#   swiglu -> SwiGLU FFN
ffn_variant: "relu"

# Scheduled DropHead.
# These values have no effect while attention_variant == "normal".
drophead_rate: 0.1
drophead_schedule: "v"        # v | fixed
drophead_warmup_steps: 8000
drophead_total_steps: 18400

# SwiGLU hidden size.
# Has no effect while ffn_variant == "relu".
# 1360 is approximately parameter-matched to the baseline ReLU FFN
# with d_inner_hid=2048.
swiglu_inner_hid: 1360

# Relative Position Bias maximum distance.
# Has no effect unless attention_variant == "relative_bias".
max_relative_position: 16
